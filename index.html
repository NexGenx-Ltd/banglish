<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banglish - Learn English & Bengali</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:#0f172a;
color:white;
line-height:1.6;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

.hero{
padding:100px 20px;
text-align:center;
background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
max-width:700px;
margin:0 auto;
}

.download-btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:white;
color:#2563eb;
text-decoration:none;
font-weight:bold;
border-radius:50px;
}

.section{
padding:80px 20px;
}

.section-title{
text-align:center;
font-size:40px;
margin-bottom:50px;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.card h3{
margin-bottom:10px;
color:#60a5fa;
}

.about{
text-align:center;
max-width:800px;
margin:auto;
font-size:18px;
}

.footer{
padding:40px;
text-align:center;
background:#020617;
}

.contact{
text-align:center;
font-size:18px;
}

@media(max-width:768px){
.hero h1{
font-size:42px;
}
}
</style>
</head>

<body>

<section class="hero">
<div class="container">
<h1>Banglish</h1>
<p>
Learn English and Bengali the smart way.
Improve vocabulary, grammar, pronunciation and communication skills through interactive lessons and quizzes.
</
